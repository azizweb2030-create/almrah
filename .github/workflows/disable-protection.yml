name: Disable Protection + Test Telegram
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Vercel SSO Protection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null}' \
            -w "HTTP: %{http_code}\n"

      - name: List Vercel Env Vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Vercel Env Keys ==="
          curl -s \
            "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)
for e in d.get('envs',[]):
    print(e['key'])
"

      - name: Test Telegram Worker
        run: |
          echo "Testing Worker..."
          curl -s -X POST "https://almrah-telegram.azizweb2030.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"650468940","text":"✅ المراح V2 - تم الاتصال بنجاح!","parse_mode":"HTML"}' \
            -w "\nHTTP: %{http_code}\n" --max-time 15
