name: Disable Vercel Protection
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Disable SSO + Password Protection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESP=$(curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null}' \
            -w "\nHTTP: %{http_code}")
          echo "$RESP"
          echo "✅ Done"
