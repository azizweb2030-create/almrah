name: Ops
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Vercel Protection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d '{"ssoProtection":null,"passwordProtection":null}' -w "HTTP:%{http_code}" && echo " Done"

      - name: Check Telegram Token in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          ENVS=$(curl -s "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$ENVS" | grep -o '"key":"[^"]*"' | grep -i telegram && echo "TELEGRAM_BOT_TOKEN: FOUND" || echo "TELEGRAM_BOT_TOKEN: MISSING"

      - name: Test Telegram Cloudflare Worker
        run: |
          curl -s -X POST https://almrah-telegram.azizweb2030.workers.dev -H "Content-Type: application/json" -d '{"chat_id":"650468940","text":"المراح V2 test","parse_mode":"HTML"}' -w "\nHTTP:%{http_code}" --max-time 15
