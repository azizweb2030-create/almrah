name: Ops
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Vercel Protection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null}' \
            -o result.json -w "HTTP:%{http_code}\n"
          cat result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('SSO:', d.get('ssoProtection'), '| Result: OK' if 'id' in d else '| ERR')" 2>/dev/null || cat result.json

      - name: Check Vercel Envs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
keys=[e['key'] for e in d.get('envs',[])]
print('ENV KEYS:', keys)
print('TELEGRAM_BOT_TOKEN:', 'FOUND' if 'TELEGRAM_BOT_TOKEN' in keys else 'MISSING')
"

      - name: Test Telegram Worker
        run: |
          curl -s -X POST https://almrah-telegram.azizweb2030.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"650468940","text":"المراح V2 - اختبار ✅","parse_mode":"HTML"}' \
            -w "\nHTTP:%{http_code}" --max-time 15
