name: Setup Telegram Bot Token
on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'Telegram Bot Token from @BotFather'
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Bot Token
        env:
          BOT_TOKEN: ${{ inputs.bot_token }}
        run: |
          RESP=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getMe")
          echo "$RESP"
          
      - name: Add to Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BOT_TOKEN: ${{ inputs.bot_token }}
        run: |
          # حذف القديم أولاً
          ENV_ID=$(curl -s \
            "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; envs=json.load(sys.stdin).get('envs',[]); match=[e['id'] for e in envs if e['key']=='TELEGRAM_BOT_TOKEN']; print(match[0] if match else '')")
          
          if [ -n "$ENV_ID" ]; then
            curl -s -X DELETE \
              "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env/$ENV_ID?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
            echo "Deleted old token"
          fi
          
          # إضافة الجديد
          curl -s -X POST \
            "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"TELEGRAM_BOT_TOKEN\",\"value\":\"$BOT_TOKEN\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" \
            -w "\nHTTP: %{http_code}\n"
          echo "✅ TELEGRAM_BOT_TOKEN added to Vercel"
          
      - name: Trigger Redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v13/deployments?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"-","gitSource":{"type":"github","repoId":"1253879661","ref":"main"}}' \
            -w "\nHTTP: %{http_code}\n"
          echo "✅ Redeployment triggered"
