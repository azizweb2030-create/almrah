name: Check and Add Telegram Token
on:
  workflow_dispatch:
    inputs:
      telegram_token:
        description: 'Telegram Bot Token (اتركه فارغاً للفحص فقط)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Optionally Add Token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TG_TOKEN_INPUT: ${{ inputs.telegram_token }}
        run: |
          echo "=== Checking existing env vars ==="
          ENVS=$(curl -s "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$ENVS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
keys=[e['key'] for e in d.get('envs',[])]
print('All keys:', keys)
print('TELEGRAM_BOT_TOKEN:', 'FOUND' if 'TELEGRAM_BOT_TOKEN' in keys else 'MISSING')
"
          if [ -n "$TG_TOKEN_INPUT" ]; then
            echo "=== Adding TELEGRAM_BOT_TOKEN ==="
            curl -s -X POST \
              "https://api.vercel.com/v10/projects/prj_dYGxk9IRUc4Rg7crLpb3MM1dwR8c/env?teamId=team_0WM1wNiYAi7vHhbHDqc6Lcha" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"TELEGRAM_BOT_TOKEN\",\"value\":\"$TG_TOKEN_INPUT\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" \
              -w "\nHTTP:%{http_code}"
            echo "Token added!"
            
            echo "=== Verifying token with Telegram API ==="
            curl -s "https://api.telegram.org/bot$TG_TOKEN_INPUT/getMe"
          fi
